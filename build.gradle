plugins {
    id 'application'
    id 'jacoco'
    id 'io.freefair.lombok' version '8.6'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots/')
    }

    maven {
        url = uri('https://oss.sonatype.org/content/repositories/releases/')
    }
}

def ENV = System.getenv()

def gitRef = { ->
  return providers.exec {
    commandLine 'git', 'rev-parse', '--quiet', '--revs-only', '--verify', '--short', 'HEAD'
  }.standardOutput.asText.get().trim()
}

group = 'net.ripe.rpki.ta'
version = ENV['RELEASE_VERSION'] ?: gitRef()
description = 'RIPE NCC Trust Anchor'

dependencies {
    implementation 'net.ripe.rpki:rpki-commons:1.41'
    implementation 'commons-cli:commons-cli:1.9.0'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.20'

    testImplementation(platform('org.junit:junit-bom:5.9.3'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

lombok {
    // Java 25 needs lombok >= 1.18.40, newer than the plugin's default
    version = '1.18.48'
}

dependencyLocking {
    lockAllConfigurations()
}

compileJava.options.encoding = 'UTF-8'
compileJava.options.compilerArgs << "-Xlint:all" << "-Werror"
distTar.compression = Compression.GZIP

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'net.ripe.rpki.ta.Main'
}

task executableJar(type: Jar) {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    archiveFileName = rootProject.name + '.jar'
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    } {
        exclude "META-INF/LICENSE*"
        exclude "META-INF/NOTICE*"
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "META-INF/versions/9/module-info.class"
    }
    with jar
}

test {
    useJUnitPlatform {}

    // Coverage with jacoco
    finalizedBy jacocoTestReport
}
jacoco {
    // Java 25 class files need jacoco >= 0.8.14, newer than Gradle's default
    toolVersion = '0.8.16'
}
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
    }
}

// Application plugin sets up distribution. We have to add the buildscripts manually.
distributions {
  main {
    contents {
      from('src/main/scripts') {
        dirPermissions { unix(0755) }
        filePermissions { unix(0555) }
      }
    }
  }
}

jib {
    from {
      image = "eclipse-temurin:25-jammy"
      platforms {
        platform {
          architecture = 'amd64'
          os = 'linux'
        }
        platform {
          architecture = 'arm64'
          os = 'linux'
        }
      }
    }
    to { image = "ghcr.io/ripe-ncc/rpki-ta-0" }
}
